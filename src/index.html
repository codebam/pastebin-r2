<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sean's Pastebin</title>
<meta name="description" content="Text in, short link out. Stored on Cloudflare R2.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▤</text></svg>">
<style>
:root{
  --bg:#0b0d10; --panel:#111418; --panel-2:#161a1f; --line:#232931;
  --fg:#d7dee6; --muted:#7e8894; --dim:#59626e;
  --accent:#5ee6a8; --accent-dim:rgba(94,230,168,.12);
  --amber:#e8b757; --red:#f0736a;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f4; --panel:#ffffff; --panel-2:#eef1ee; --line:#d8ded8;
    --fg:#12171c; --muted:#5b6570; --dim:#8b939c;
    --accent:#0f8d5c; --accent-dim:rgba(15,141,92,.09);
    --amber:#9a6f14; --red:#c93a31;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}

.top{display:flex;align-items:baseline;gap:10px;padding:34px 0 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.top .prompt{color:var(--accent)}
.top h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
.top .cursor{width:8px;height:15px;background:var(--accent);display:inline-block;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.top .cursor{animation:none}}
.top .meta{margin-left:auto;color:var(--dim);font-size:12px}

.panel{border:1px solid var(--line);background:var(--panel)}
.panel + .panel{margin-top:20px}
.bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.bar .tag{color:var(--accent)}
.bar .right{margin-left:auto;color:var(--dim)}

.editor{display:flex;position:relative}
.gutter{flex:0 0 auto;padding:12px 10px;text-align:right;color:var(--dim);font-size:13px;line-height:1.6;
  user-select:none;border-right:1px solid var(--line);background:var(--panel-2);overflow:hidden;white-space:pre}
#paste-text{
  flex:1 1 auto;min-width:0;display:block;padding:12px 14px;border:0;outline:0;resize:vertical;
  background:transparent;color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.6;
  min-height:230px;white-space:pre;overflow-x:auto;tab-size:4}
#paste-text::placeholder{color:var(--dim)}

.drop{position:absolute;inset:6px;display:none;place-items:center;border:1px dashed var(--accent);
  background:var(--accent-dim);color:var(--accent);font-size:13px;pointer-events:none}
.editor.dragging .drop{display:grid}

.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel-2)}
.btn{font-family:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:.12s}
.btn:hover{color:var(--fg);border-color:var(--dim)}
.btn:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.btn.go{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);font-weight:600}
.btn.go:hover{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.sp{flex:1}
.hint{color:var(--dim);font-size:12px}

#alerts{display:grid;gap:8px;margin-bottom:16px}
#alerts:empty{margin-bottom:0}
.alert{padding:8px 12px;font-size:12.5px;border:1px solid}
.alert.success{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.alert.warning{color:var(--amber);border-color:var(--amber);background:rgba(232,183,87,.1)}
.alert.error{color:var(--red);border-color:var(--red);background:rgba(240,115,106,.1)}

.out{border:1px solid var(--accent);background:var(--accent-dim);margin-top:20px;padding:12px}
.out[hidden]{display:none}
.out .ln{color:var(--accent);font-size:12px;margin-bottom:8px}
.urlrow{display:flex;border:1px solid var(--line);background:var(--panel)}
.urlrow input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-family:inherit;font-size:13px;padding:9px 11px;outline:0}
.urlrow button{border:0;border-left:1px solid var(--line);background:var(--panel-2);color:var(--accent);font-family:inherit;font-size:12.5px;padding:9px 14px;cursor:pointer}
.urlrow button:hover{background:var(--line)}
.links{margin-top:10px;font-size:12px;color:var(--dim)}
.links a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--dim);margin-right:14px}
.links a:hover{color:var(--fg);border-bottom-color:var(--fg)}

.curl{padding:12px 14px;color:var(--muted);font-size:12.5px;overflow-x:auto;white-space:pre;margin:0}
.curl .p{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);padding:8px 16px;
  border:1px solid var(--accent);background:var(--panel);color:var(--accent);font-size:12.5px;
  opacity:0;pointer-events:none;transition:.18s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{margin-top:28px;color:var(--dim);font-size:12px}
footer a{color:var(--muted)}

@media (max-width:560px){
  .top{padding-top:26px}
  .foot .hint{display:none}
  .btn{flex:1 1 auto;text-align:center}
  .sp{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="prompt">~$</span>
    <h1>pastebin</h1>
    <span class="cursor"></span>
    <span class="meta">r2 · edge</span>
  </div>

  <div id="alerts"></div>

  <div class="panel">
    <div class="bar"><span class="tag">●</span> buffer <span class="right" id="counter">0 B · 1 line</span></div>
    <div class="editor" id="drop-zone">
      <div class="gutter" id="gutter" aria-hidden="true">1</div>
      <textarea id="paste-text" spellcheck="false" wrap="off"
        placeholder="type here, or drop a file on this box…"></textarea>
      <div class="drop">drop file to load</div>
    </div>
    <div class="foot">
      <input type="file" id="file-upload" hidden>
      <button class="btn" id="file-btn">attach</button>
      <button class="btn" id="clip-btn">from clipboard</button>
      <span class="sp"></span>
      <span class="hint">^⏎</span>
      <button class="btn" id="clear-btn">clear</button>
      <button class="btn go" id="submit-btn">create paste</button>
    </div>
  </div>

  <div class="out" id="result" hidden>
    <div class="ln">✓ created</div>
    <div class="urlrow">
      <input type="text" id="paste-url" readonly>
      <button id="copy-url-btn">copy</button>
    </div>
    <div class="links">
      <a id="link-raw" href="#" target="_blank" rel="noopener">raw</a>
      <a id="link-highlight" href="#" target="_blank" rel="noopener">highlighted</a>
    </div>
  </div>

  <div class="panel">
    <div class="bar">cli</div>
<pre class="curl"><span class="p">$</span> curl -T file.txt <span class="host">https://example.com</span>
<span class="p">$</span> pbpaste | curl --data-binary @- <span class="host">https://example.com</span></pre>
  </div>

  <footer>hono · cloudflare workers · <a href="https://github.com/codebam/pastebin-r2">github.com/codebam/pastebin-r2</a></footer>
</div>

<div class="toast" id="toast">copied</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pasteText, gutter, counter, result, pasteUrl, submitBtn, dropZone, toast, fileUpload;
  var toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function alertMsg(message, type) {
    var el = document.createElement('div');
    el.className = 'alert ' + (type || 'success');
    el.textContent = message;
    $('alerts').appendChild(el);
    setTimeout(function () { el.remove(); }, 5000);
  }

  // Copy that still works when the Clipboard API is unavailable (insecure
  // context, denied permission, unfocused document).
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    return new Promise(function (resolve, reject) {
      var fallback = function () {
        legacyCopy(text) ? resolve() : reject(new Error('copy blocked'));
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(resolve, fallback);
      } else {
        fallback();
      }
    });
  }

  // Line numbers are only correct because the textarea has wrap="off" — a
  // wrapped line would occupy more rows than the gutter draws.
  function syncGutter() {
    var lines = pasteText.value.split('\n').length;
    var out = '';
    for (var i = 1; i <= lines; i++) out += i + '\n';
    gutter.textContent = out;
    gutter.scrollTop = pasteText.scrollTop;
  }

  function updateCounter() {
    var bytes = new TextEncoder().encode(pasteText.value).length;
    var lines = pasteText.value.split('\n').length;
    counter.textContent = bytes.toLocaleString() + ' B · ' + lines + (lines === 1 ? ' line' : ' lines');
  }

  function onInput() { syncGutter(); updateCounter(); }

  function readFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      pasteText.value = e.target.result;
      onInput();
      alertMsg('loaded ' + file.name, 'success');
    };
    reader.onerror = function () { alertMsg('could not read ' + file.name, 'error'); };
    reader.readAsText(file);
  }

  function showResult(url) {
    url = String(url).trim();
    pasteUrl.value = url;
    $('link-raw').href = url;
    $('link-highlight').href = url + '/highlight';
    result.hidden = false;
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function submit() {
    if (!pasteText.value.trim()) {
      alertMsg('nothing to paste yet', 'warning');
      pasteText.focus();
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'creating…';
    try {
      // Same-origin, so the worker echoes back a URL on whatever host the
      // user is actually visiting.
      var response = await fetch('/', { method: 'POST', body: pasteText.value });
      if (response.ok) {
        showResult(await response.text());
      } else {
        alertMsg('failed: HTTP ' + response.status, 'error');
      }
    } catch (err) {
      alertMsg('error: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'create paste';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    pasteText = $('paste-text');
    gutter = $('gutter');
    counter = $('counter');
    result = $('result');
    pasteUrl = $('paste-url');
    submitBtn = $('submit-btn');
    dropZone = $('drop-zone');
    toast = $('toast');
    fileUpload = $('file-upload');

    Array.prototype.forEach.call(document.querySelectorAll('.host'), function (el) {
      el.textContent = window.location.origin;
    });

    onInput();
    pasteText.addEventListener('input', onInput);
    pasteText.addEventListener('scroll', function () { gutter.scrollTop = pasteText.scrollTop; });

    $('file-btn').addEventListener('click', function () { fileUpload.click(); });
    fileUpload.addEventListener('change', function () {
      if (this.files && this.files[0]) readFile(this.files[0]);
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (ev) {
      dropZone.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); });
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      dropZone.addEventListener(ev, function () { dropZone.classList.add('dragging'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dropZone.addEventListener(ev, function () { dropZone.classList.remove('dragging'); });
    });
    dropZone.addEventListener('drop', function (e) {
      var files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) readFile(files[0]);
    });

    submitBtn.addEventListener('click', submit);
    document.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
    });

    $('clear-btn').addEventListener('click', function () {
      pasteText.value = '';
      onInput();
      result.hidden = true;
      pasteText.focus();
    });

    $('clip-btn').addEventListener('click', function () {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        alertMsg('clipboard read unavailable in this browser', 'warning');
        return;
      }
      navigator.clipboard.readText().then(function (text) {
        if (!text) { alertMsg('clipboard is empty', 'warning'); return; }
        pasteText.value = text;
        onInput();
      }, function () {
        alertMsg('clipboard permission denied', 'warning');
      });
    });

    $('copy-url-btn').addEventListener('click', function () {
      if (!pasteUrl.value) return;
      copyText(pasteUrl.value).then(function () {
        showToast('url copied');
      }, function (err) {
        alertMsg('failed to copy: ' + err.message, 'error');
      });
    });
  });
})();
</script>
</body>
</html>
